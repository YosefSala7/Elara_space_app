name: space_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  flutter_svg: ^2.3.2
  flutter_bounceable: ^1.2.0
  flutter_gen: ^5.15.0
  lottie: ^3.8.2
  glass: ^2.3.2

dev_dependencies:
  build_runner: ^2.12.0
  flutter_gen_runner:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
flutter_gen:
  output: lib/core/gen/
  integrations:
    image: true
    flutter_svg: true
    lottie: true

flutter:


  uses-material-design: true

  assets:
    - assets/icons/
    - assets/lotties/
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VariableFont_wght (1).ttf
    - family: Audiowide
      fonts:
        - asset: assets/fonts/Audiowide-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #